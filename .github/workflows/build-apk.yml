name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Limpar lixo do package.json e app.json
        run: |
          node -e '
            for (const file of ["package.json", "app.json"]) {
              let txt = require("fs").readFileSync(file, "utf8");
              txt = txt.slice(txt.indexOf("{"), txt.lastIndexOf("}") + 1);
              JSON.parse(txt);
              require("fs").writeFileSync(file, txt + "\n");
            }
          '

      - name: Clean old android folder if any
        run: rm -rf android node_modules package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForjaFit-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          
